<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <rect width="1200" height="800" fill="#f4f4f4"/>
  <circle cx="960" cy="150" r="220" fill="#ececec"/>
  <rect x="120" y="560" width="960" height="26" rx="13" fill="#dcdcdc"/>
  <!-- workbench -->
  <rect x="180" y="540" width="840" height="18" rx="9" fill="#c9c9c9"/>
  <!-- robot body (jar-shaped kitchen robot) -->
  <g>
    <rect x="470" y="300" width="260" height="250" rx="34" fill="#ffffff" stroke="#1a1a1a" stroke-width="6"/>
    <rect x="500" y="330" width="200" height="120" rx="14" fill="#1a1a1a"/>
    <rect x="512" y="342" width="176" height="96" rx="8" fill="#242424"/>
    <circle cx="600" cy="390" r="34" fill="#f0785a" opacity="0.85"/>
    <rect x="500" y="470" width="200" height="18" rx="9" fill="#e0e0e0"/>
    <rect x="500" y="498" width="140" height="14" rx="7" fill="#e0e0e0"/>
    <!-- lid handle -->
    <rect x="565" y="270" width="70" height="34" rx="12" fill="#e8543a"/>
    <circle cx="600" cy="270" r="14" fill="#c23f28"/>
  </g>
  <!-- steam -->
  <path d="M560 250 C550 235 562 222 552 205" fill="none" stroke="#f0785a" stroke-width="8" stroke-linecap="round" opacity="0.7"/>
  <path d="M600 240 C590 225 602 212 592 195" fill="none" stroke="#f0785a" stroke-width="8" stroke-linecap="round"/>
  <path d="M640 250 C630 235 642 222 632 205" fill="none" stroke="#f0785a" stroke-width="8" stroke-linecap="round" opacity="0.7"/>
  <!-- wrench / tool -->
  <g transform="translate(790,420) rotate(18)">
    <rect x="0" y="0" width="140" height="26" rx="13" fill="#c23f28"/>
    <circle cx="150" cy="13" r="30" fill="none" stroke="#c23f28" stroke-width="22"/>
  </g>
  <!-- screwdriver -->
  <g transform="translate(330,470) rotate(-24)">
    <rect x="0" y="0" width="120" height="16" rx="8" fill="#5c5c5c"/>
    <rect x="118" y="-6" width="34" height="28" rx="6" fill="#e8543a"/>
  </g>
  <!-- small gears -->
  <circle cx="330" cy="330" r="26" fill="none" stroke="#c9c9c9" stroke-width="10"/>
  <circle cx="880" cy="320" r="20" fill="none" stroke="#c9c9c9" stroke-width="8"/>
</svg>
